(function(){

var cvs = document.getElementById('scene');
var ctx = cvs.getContext('2d');
var DW = 1600, DH = 900;

var fit = { s: 1, ox: 0, oy: 0 };
var dpr = 1;

function resize(){
  var vw = innerWidth, vh = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width  = Math.round(vw * dpr);
  cvs.height = Math.round(vh * dpr);
  var s = Math.min(vw / DW, vh / DH);
  fit.s = s;
  fit.ox = (vw - DW * s) / 2;
  fit.oy = (vh - DH * s) / 2;
}

var cl01 = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; };
var lerp = function(a,b,t){ return a + (b - a) * t; };
var eo   = function(t){ t = cl01(t); return 1 - Math.pow(1 - t, 3); };
var eio  = function(t){ t = cl01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; };
var eob  = function(t){ t = cl01(t); var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2); };
var seg  = function(t,a,b){ return cl01((t - a) / (b - a)); };

function mixHex(a, b, t){
  var ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  var br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  return 'rgb(' + Math.round(lerp(ar,br,t)) + ',' + Math.round(lerp(ag,bg,t)) + ',' + Math.round(lerp(ab,bb,t)) + ')';
}

function rr(c, x, y, w, h, r){
  var rad = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y,     x + w, y + h, rad);
  c.arcTo(x + w, y + h, x,     y + h, rad);
  c.arcTo(x,     y + h, x,     y,     rad);
  c.arcTo(x,     y,     x + w, y,     rad);
  c.closePath();
}

function spark(c, x, y, r, a, col){
  if (a <= 0.01 || r <= 0.2) return;
  c.save();
  c.globalAlpha = a;
  c.translate(x, y);
  var k = r * 0.20;
  c.beginPath();
  c.moveTo(0, -r);
  c.quadraticCurveTo(k, -k, r, 0);
  c.quadraticCurveTo(k, k, 0, r);
  c.quadraticCurveTo(-k, k, -r, 0);
  c.quadraticCurveTo(-k, -k, 0, -r);
  c.closePath();
  c.fillStyle = col || '#FFFFFF';
  c.fill();
  c.restore();
}

for (var ni = 0; ni < (TEXN + 1) * (TEXN + 1); ni++) nodes.push({z: 0, v: 0});

var texCache = {};
var TEXBUCKETS = 12;

function clampF(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

function pathBear(c, cx, cy, R){
  c.beginPath();
  c.arc(cx, cy, R, 0, Math.PI * 2);
  var off = 0.70 * R, er = 0.38 * R;
  c.moveTo(cx + off + er, cy - off);
  c.arc(cx + off, cy - off, er, 0, Math.PI * 2);
  c.moveTo(cx - off + er, cy - off);
  c.arc(cx - off, cy - off, er, 0, Math.PI * 2);
  c.closePath();
}

function buildTexture(cook){
  var t = document.createElement('canvas');
  t.width = 512; t.height = 512;
  var g = t.getContext('2d');

  var R = 164, cx = 256, cy = 278;

  var c0 = mixHex('#FFF8DE', '#FBC97C', cook);
  var c1 = mixHex('#FBE7BA', '#D99544', cook);
  var c2 = mixHex('#EECB90', '#BE8544', cook);
  var c3 = mixHex('#C9955A', '#6E3A11', cook);

  g.save();
  pathBear(g, cx, cy + 6, R);
  g.shadowColor = 'rgba(150,90,40,0.45)';
  g.shadowBlur = 20;
  g.shadowOffsetY = 12;
  g.fillStyle = c3;
  g.fill();
  g.restore();

  pathBear(g, cx, cy, R);
  var rg = g.createRadialGradient(cx - 46, cy - 52, 22, cx, cy, R * 1.22);
  rg.addColorStop(0.00, c0);
  rg.addColorStop(0.34, c1);
  rg.addColorStop(0.66, c2);
  rg.addColorStop(0.88, c3);
  rg.addColorStop(1.00, c3);
  g.fillStyle = rg;
  g.fill();

  g.save();
  pathBear(g, cx, cy, R);
  g.clip();

  var sh = g.createLinearGradient(0, 70, 0, 440);
  sh.addColorStop(0.00, 'rgba(255,252,226,0.26)');
  sh.addColorStop(0.55, 'rgba(255,255,255,0)');
  sh.addColorStop(1.00, 'rgba(120,64,20,0.20)');
  g.fillStyle = sh;
  g.fillRect(0, 0, 512, 512);

  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 760; i++){
    var x = 72 + rnd() * 368;
    var y = 78 + rnd() * 350;
    var r = 0.5 + rnd() * 2.6;
    g.beginPath();
    g.ellipse(x, y, r, r * 0.72, 0, 0, Math.PI * 2);
    g.fillStyle = rnd() > 0.5 ? 'rgba(150,92,42,0.16)' : 'rgba(255,246,214,0.52)';
    g.fill();
  }
  for (var j = 0; j < 18; j++){
    g.beginPath();
    g.ellipse(108 + rnd() * 296, 128 + rnd() * 250, 2 + rnd() * 3.2, 1.4 + rnd() * 2.2, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(178,118,58,0.22)';
    g.fill();
  }

  var ink = mixHex('#C8B48C', '#8C4E1E', clampF(cook * 1.2));
  g.fillStyle = ink;
  g.beginPath(); g.ellipse(cx - 51, cy - 10, 7.5, 9.5, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx + 51, cy - 10, 7.5, 9.5, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = ink;
  g.lineWidth = 4.8;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(cx, cy + 20, 19, 0.16 * Math.PI, 0.84 * Math.PI);
  g.stroke();

  g.globalAlpha = 0.5;
  g.fillStyle = mixHex('#E8A8B0', '#C97F62', cook);
  g.beginPath(); g.ellipse(cx - 90, cy + 30, 17, 11, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx + 90, cy + 30, 17, 11, 0, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;

  g.restore();

  return t;
}

function getTex(cook){
  var b = Math.round(clampF(cook) * (TEXBUCKETS - 1));
  if (!texCache[b]) texCache[b] = buildTexture(b / (TEXBUCKETS - 1));
  return texCache[b];
}

var box = {left: 0, top: 0, side: 0};

function setBox(cx, cy, r){
  box.side = r * 2.5;
  box.left = cx - box.side / 2;
  box.top  = cy - box.side * 0.52;
}

function tri(c, img, a, b, d, sa, sb, sd){
  var den = sa.x*(sb.y-sd.y) + sb.x*(sd.y-sa.y) + sd.x*(sa.y-sb.y);
  if (Math.abs(den) < 0.01) return;
  var A = (a.x*(sb.y-sd.y) + b.x*(sd.y-sa.y) + d.x*(sa.y-sb.y)) / den;
  var B = (a.y*(sb.y-sd.y) + b.y*(sd.y-sa.y) + d.y*(sa.y-sb.y)) / den;
  var C = (a.x*(sd.x-sb.x) + b.x*(sa.x-sd.x) + d.x*(sb.x-sa.x)) / den;
  var D = (a.y*(sd.x-sb.x) + b.y*(sa.x-sd.x) + d.y*(sb.x-sa.x)) / den;
  var E = (a.x*(sb.x*sd.y-sd.x*sb.y) + b.x*(sd.x*sa.y-sa.x*sd.y) + d.x*(sa.x*sb.y-sb.x*sa.y)) / den;
  var F = (a.y*(sb.x*sd.y-sd.x*sb.y) + b.y*(sd.x*sa.y-sa.x*sd.y) + d.y*(sa.x*sb.y-sb.x*sa.y)) / den;
  c.save();
  c.beginPath();
  var gx = (a.x + b.x + d.x) / 3, gy = (a.y + b.y + d.y) / 3;
  var ex = 1.014;
  c.moveTo(gx + (a.x - gx) * ex, gy + (a.y - gy) * ex);
  c.lineTo(gx + (b.x - gx) * ex, gy + (b.y - gy) * ex);
  c.lineTo(gx + (d.x - gx) * ex, gy + (d.y - gy) * ex);
  c.closePath();
  c.clip();
  c.transform(A, B, C, D, E, F);
  c.drawImage(img, 0, 0);
  c.restore();
}

function springStep(dt, r, allowTouch){
  var p = G.pointer;
  var cell = box.side / TEXN;
  var st = Math.min(dt * 60, 2);

  for (var y = 0; y <= TEXN; y++){
    for (var x = 0; x <= TEXN; x++){
      var n = nodes[y * (TEXN + 1) + x];
      var wx = box.left + x * cell;
      var wy = box.top + y * cell;
      var f = 0;

      if (allowTouch && p.on){
        var dx = wx - p.x, dy = wy - p.y;
        f += Math.exp(-(dx*dx + dy*dy) / (r*r*0.085)) * 1.35;
      }
      for (var k = 0; k < G.sparks.length; k++){
        var h = G.sparks[k];
        if (!h.touch) continue;
        var ax = wx - h.x, ay = wy - h.y;
        f += Math.exp(-(ax*ax + ay*ay) / (r*r*0.09)) * h.life * 0.7;
      }

      n.v += (f - n.z) * 0.11 * st;
      n.v *= Math.pow(0.82, st);
      n.z += n.v * st;
    }
  }
}

function drawMesh(c, cook){
  var cell = box.side / TEXN;
  var stepT = 512 / TEXN;
  var verts = [];
  var i, j, x, y;

  for (y = 0; y <= TEXN; y++){
    for (x = 0; x <= TEXN; x++){
      var n = nodes[y * (TEXN + 1) + x];
      var wx = box.left + x * cell;
      var wy = box.top + y * cell;
      verts.push({x: wx - n.z * wx * 0.028, y: wy + n.z * 9});
    }
  }

  var tex = getTex(cook);

  for (j = 0; j < TEXN; j++){
    for (i = 0; i < TEXN; i++){
      var a = verts[j * (TEXN + 1) + i];
      var b = verts[j * (TEXN + 1) + i + 1];
      var d = verts[(j + 1) * (TEXN + 1) + i];
      var e = verts[(j + 1) * (TEXN + 1) + i + 1];
      tri(c, tex, a, b, d, {x: i*stepT, y: j*stepT}, {x: (i+1)*stepT, y: j*stepT}, {x: i*stepT, y: (j+1)*stepT});
      tri(c, tex, b, e, d, {x: (i+1)*stepT, y: j*stepT}, {x: (i+1)*stepT, y: (j+1)*stepT}, {x: i*stepT, y: (j+1)*stepT});
    }
  }
}

  var g = c.createLinearGradient(0, 0, 0, DH);

  g.addColorStop(1.00, 'rgba(235,230,221,0.80)');

  var rg = c.createRadialGradient(830, 420, 40, 830, 420, 660);

  rg.addColorStop(1.00, 'rgba(255,255,255,0)');

}

function drawCooker(c){}

function drawPan(c, t){
  var p = LAY.pan, R = p.r;

  c.save();
  c.translate(p.x, p.y);

  var sh = c.createRadialGradient(0, R * 1.05, R * 0.10, 0, R * 1.05, R * 1.62);
  sh.addColorStop(0.00, 'rgba(64,54,40,0.17)');
  sh.addColorStop(0.52, 'rgba(64,54,40,0.07)');
  sh.addColorStop(1.00, 'rgba(64,54,40,0)');
  c.fillStyle = sh;
  c.beginPath();
  c.ellipse(R * 0.05, R * 0.98, R * 1.02, R * 0.80, 0, 0, Math.PI * 2);
  c.fill();

  c.save();
  c.beginPath();
  c.moveTo(-R * 0.200, R * 0.84);
  c.lineTo( R * 0.200, R * 0.84);
  c.lineTo( R * 0.170, R * 1.20);
  c.quadraticCurveTo(R * 0.170, R * 1.27, R * 0.132, R * 1.27);
  c.lineTo(-R * 0.132, R * 1.27);
  c.quadraticCurveTo(-R * 0.170, R * 1.27, -R * 0.170, R * 1.20);
  c.closePath();
  var ng = c.createLinearGradient(-R * 0.2, 0, R * 0.2, 0);
  ng.addColorStop(0.00, '#3E3930');
  ng.addColorStop(0.28, '#726A5D');
  ng.addColorStop(0.52, '#564F45');
  ng.addColorStop(1.00, '#312D27');
  c.fillStyle = ng;
  c.fill();
  c.restore();

  var hw = R * 0.212, hTop = R * 1.20, hBot = R * 1.99;

  c.save();
  c.shadowColor = 'rgba(120,86,16,0.24)';
  c.shadowBlur = 18;
  c.shadowOffsetX = 4;
  c.shadowOffsetY = 10;
  rr(c, -hw, hTop, hw * 2, hBot - hTop, hw);
  var hg = c.createLinearGradient(-hw, 0, hw, 0);
  hg.addColorStop(0.00, '#D69F1A');
  hg.addColorStop(0.09, '#F3C83F');
  hg.addColorStop(0.32, '#FBE37F');
  hg.addColorStop(0.56, '#F5CE50');
  hg.addColorStop(0.84, '#E9B52B');
  hg.addColorStop(1.00, '#C68C0D');
  c.fillStyle = hg;
  c.fill();
  c.restore();

  c.save();
  rr(c, -hw, hTop, hw * 2, hBot - hTop, hw);
  c.clip();
  c.fillStyle = 'rgba(255,255,255,0.34)';
  rr(c, -hw * 0.60, hTop + 14, hw * 0.26, hBot - hTop - 34, hw * 0.13);
  c.fill();
  var dk = c.createLinearGradient(-hw, 0, hw, 0);
  dk.addColorStop(0.00, 'rgba(138,90,6,0.38)');
  dk.addColorStop(0.16, 'rgba(138,90,6,0)');
  dk.addColorStop(0.86, 'rgba(138,90,6,0)');
  dk.addColorStop(1.00, 'rgba(138,90,6,0.42)');
  c.fillStyle = dk;
  c.fillRect(-hw, hTop, hw * 2, hBot - hTop);
  c.restore();

  c.beginPath();
  c.arc(0, hBot - hw * 0.92, hw * 0.42, 0, Math.PI * 2);
  c.fillStyle = '#FCFBF8';
  c.fill();
  c.lineWidth = 1.6;
  c.strokeStyle = 'rgba(150,100,8,0.30)';
  c.stroke();

  pathBear(c, 0, 0, R);
  var og = c.createLinearGradient(-R * 0.9, -R, R * 0.8, R);
  og.addColorStop(0.00, '#6C6456');
  og.addColorStop(0.32, '#524B41');
  og.addColorStop(0.70, '#3D3830');
  og.addColorStop(1.00, '#544D42');
  c.fillStyle = og;
  c.fill();

  pathBear(c, 0, 0, R);
  c.lineWidth = 2.2;
  c.strokeStyle = 'rgba(255,255,255,0.24)';
  c.stroke();

  var cin = R * 0.895;
  pathBear(c, 0, 0, cin);
  var cg = c.createRadialGradient(-R * 0.28, -R * 0.34, R * 0.05, 0, R * 0.04, cin * 1.10);
  cg.addColorStop(0.00, '#B3A99B');
  cg.addColorStop(0.38, '#9E9487');
  cg.addColorStop(0.72, '#8B8174');
  cg.addColorStop(1.00, '#7B7164');
  c.fillStyle = cg;
  c.fill();

  c.save();
  pathBear(c, 0, 0, R);
  c.clip();
  var band = c.createRadialGradient(0, 0, R * 0.76, 0, 0, R * 0.995);
  band.addColorStop(0.00, 'rgba(28,22,16,0)');
  band.addColorStop(0.66, 'rgba(28,22,16,0.12)');
  band.addColorStop(1.00, 'rgba(28,22,16,0.40)');
  c.fillStyle = band;
  c.fillRect(-R, -R, R * 2, R * 2);
  c.restore();

  c.save();
  pathBear(c, 0, 0, cin);
  c.clip();
  var gl = c.createRadialGradient(-R * 0.30, -R * 0.42, 4, -R * 0.05, -R * 0.14, cin * 1.06);
  gl.addColorStop(0.00, 'rgba(255,255,255,0.30)');
  gl.addColorStop(0.46, 'rgba(255,255,255,0.06)');
  gl.addColorStop(1.00, 'rgba(255,255,255,0)');
  c.fillStyle = gl;
  c.fillRect(-R, -R, R * 2, R * 2);
  c.restore();

  var rivets = [R * 1.045, R * 1.145];
  for (var i = 0; i < 2; i++){
    var ry = rivets[i], rad = R * 0.036;
    c.beginPath();
    c.arc(0, ry, rad, 0, Math.PI * 2);
    var rgv = c.createRadialGradient(-rad * 0.35, ry - rad * 0.35, 1, 0, ry, rad);
    rgv.addColorStop(0.00, '#F2EFE8');
    rgv.addColorStop(0.52, '#C8C2B7');
    rgv.addColorStop(1.00, '#837C70');
    c.fillStyle = rgv;
    c.fill();
  }

  c.restore();
}

function drawBowl(c, t){
  var b = LAY.bowl, r = b.r;

  c.save();
  c.translate(b.x, b.y + Math.sin(t * 1.4) * 1.2);

  var sh = c.createRadialGradient(0, r * 0.80, r * 0.18, 0, r * 0.80, r * 1.30);
  sh.addColorStop(0.00, 'rgba(70,58,40,0.20)');
  sh.addColorStop(0.58, 'rgba(70,58,40,0.07)');
  sh.addColorStop(1.00, 'rgba(70,58,40,0)');
  c.fillStyle = sh;
  c.beginPath();
  c.ellipse(0, r * 0.84, r * 1.06, r * 0.36, 0, 0, Math.PI * 2);
  c.fill();

  var og = c.createLinearGradient(-r, -r, r * 0.55, r);
  og.addColorStop(0.00, '#FFFFFF');
  og.addColorStop(0.40, '#F5F1E9');
  og.addColorStop(0.78, '#E5DFD4');
  og.addColorStop(1.00, '#D4CDC0');
  c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2);
  c.fillStyle = og; c.fill();
  c.lineWidth = 1.4;
  c.strokeStyle = 'rgba(60,52,42,0.12)';
  c.stroke();

  var ir = r * 0.865;
  c.beginPath(); c.arc(0, 0, ir, 0, Math.PI * 2);
  var ig = c.createRadialGradient(-ir * 0.22, -ir * 0.28, ir * 0.08, 0, 0, ir);

var AC = null, master = null, muted = false, sizzle = null;

function initAudio(){
  if (AC) { if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } return; }
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = 0.5;
    master.connect(AC.destination);
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
}

function tone(freq, dur, type, vol, slideTo){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

function noiseBurst(dur, vol, hz){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime;
    var len = Math.ceil(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = hz || 1800; bp.Q.value = 0.9;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.22, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  } catch(e){}
}

function startSizzle(){
  if (!AC || muted || sizzle) return;
  try {
    var len = Math.floor(AC.sampleRate * 2);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3400; bp.Q.value = 0.7;
    var g = AC.createGain();
    g.gain.value = 0.0001;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start();
    g.gain.linearRampToValueAtTime(0.055, AC.currentTime + 0.5);
    sizzle = {src: src, g: g};
  } catch(e){ sizzle = null; }
}

function stopSizzle(){
  if (!sizzle || !AC) return;
  try {
    var s = sizzle;
    sizzle = null;
    s.g.gain.cancelScheduledValues(AC.currentTime);
    s.g.gain.setValueAtTime(s.g.gain.value, AC.currentTime);
    s.g.gain.linearRampToValueAtTime(0.0001, AC.currentTime + 0.28);
    setTimeout(function(){ try{ s.src.stop(); }catch(e){} }, 360);
  } catch(e){ sizzle = null; }
}

function drawHeatBar(c){
  if (!(G.step === 3 && G.batter >= 1)) return;
  var k = LAY.heat;
  var trackX = k.x + 66, trackW = k.w - 92, ty = k.y + k.h / 2;

  c.save();
  c.textAlign = 'left';
  c.letterSpacing = '2px';
  c.font = '400 10px "Helvetica Neue",Helvetica,Arial,sans-serif';
  c.fillStyle = G.heating ? INK : INK3;
  c.fillText('HEAT', k.x, ty + 4);
  c.letterSpacing = '0px';

  c.fillStyle = 'rgba(38,34,30,0.10)';
  rr(c, trackX, ty - 2, trackW, 4, 2);
  c.fill();

  var kw = trackW * G.heat;
  c.fillStyle = ACC;
  rr(c, trackX, ty - 2, Math.max(kw, 3), 4, 2);
  c.fill();

  for (var i = 0; i <= 3; i++){
    var tx = trackX + trackW * (i / 3);
    c.beginPath();
    c.moveTo(tx, ty + 9); c.lineTo(tx, ty + 14);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(38,34,30,0.16)';
    c.stroke();
  }

  var kx = trackX + kw;
  c.beginPath(); c.arc(kx, ty, 10, 0, Math.PI * 2);
  c.fillStyle = '#FFFFFF'; c.fill();
  c.lineWidth = 2;
  c.strokeStyle = INK;
  c.stroke();
  c.beginPath(); c.arc(kx, ty, 3.6, 0, Math.PI * 2);
  c.fillStyle = ACC; c.fill();

  c.textAlign = 'right';
  c.font = '400 11px system-ui,-apple-system,"PingFang SC",sans-serif';
  c.fillStyle = INK2;
  var lvl = G.heat < 0.34 ? '小火' : G.heat < 0.68 ? '中火' : '大火';
  c.fillText(lvl, k.x + k.w, ty + 4);
  c.restore();
}

function burstPath(c, x, y, r1, r2, n){
  c.beginPath();
  for (var i = 0; i < n * 2; i++){
    var a = -Math.PI / 2 + i * Math.PI / n;
    var r = (i % 2 === 0) ? r1 : r2;
    var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

      c.lineWidth = 24;

        c.ellipse(cx + 100, cy - 90, 18 * e, 9 * e, -0.10, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255,245,206,0.6)';
        c.fill();

        c.beginPath();
        c.moveTo(cx - 96, cy - 74);
        c.bezierCurveTo(cx - 114, cy - 28, cx - 96, cy + 4, cx - 106, cy + 34);
        c.strokeStyle = 'rgba(224,156,46,0.96)';
        c.lineWidth = 21 * e;
        c.stroke();
        c.beginPath();
        c.ellipse(cx - 106, cy + 50, 23 * e, 28 * e, 0, 0, Math.PI * 2);
        c.fillStyle = 'rgba(222,152,44,0.96)';

      for (var i = 0; i < items.length; i++){

// ------------------------------------------------------------ 循环

var last = performance.now();

function update(dt){
  G.t += dt;

  if (G.step === 3 && G.heating && G.batter >= 1){
    var rate = 0.10 + G.heat * 0.42;
    if (!G.flipped) G.cookA = Math.min(1.2, G.cookA + dt * rate);
    else G.cookB = Math.min(1.2, G.cookB + dt * rate);
  }

  for (var i = G.sparks.length - 1; i >= 0; i--){
    if (G.sparks[i].touch) G.sparks[i].life -= dt * 1.6;
    if (G.sparks[i].life <= 0) G.sparks.splice(i, 1);
  }
}

function render(now){
  var dt = (now - last) / 1000;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  last = now;
  update(dt);
  var t = G.t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  ctx.save();
  ctx.translate(fit.ox, fit.oy);
  ctx.scale(fit.s, fit.s);

  drawBackground(ctx, t);
  drawTable(ctx);
  drawHeader(ctx);
  drawSoundToggle(ctx);
  drawSteps(ctx, t);
  drawHint(ctx);
  drawCard(ctx);

  if (G.step === 2){
    drawBowl(ctx, t);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.letterSpacing = '7px';
    ctx.font = '400 12px "Helvetica Neue",Helvetica,Arial,sans-serif';
    ctx.fillStyle = INK3;
    ctx.fillText('MIXING', 760, 712);
    ctx.letterSpacing = '0px';
    ctx.font = '400 13px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = INK2;
    ctx.fillText('在盆里画圈，把面糊搅到顺滑', 760, 738);
    ctx.restore();
  } else if (G.step === 3){
    drawCooker(ctx);
    drawPan(ctx, t);
    setBox(0, 0, PRP);
    springStep(dt, PRP, true);
    drawPanPancake(ctx, t);
  } else if (G.step >= 4){
    drawDish(ctx);
    drawPlatePancake(ctx, t);
    drawDishDeco(ctx, t);
    drawDoneSticker(ctx, t);
  }

  if (G.step === 1){
    for (var i = 0; i < 4; i++){
      var it = ING[i];
      if (!G.items[i]){
        drawIngSlot(ctx, it.x, it.y, it.name);
        continue;
      }
      var ap = seg(t, G.ingT[i], G.ingT[i] + 0.5);
      if (ap > 0) drawIngredient(ctx, it.type, it.x, it.y - (1 - eob(ap)) * 70, 1.62 * (0.4 + 0.6 * eo(ap)));
    }
    drawStep1Caption(ctx, t);
  }

  if (G.step === 3) drawButtons(ctx);
  else if (G.step === 1) drawTipCard(ctx, '怎么开始', ['点左边清单里的食材', '四样全部摆上桌', '自动进入混合面糊']);
  else if (G.step === 2) drawTipCard(ctx, '怎么搅拌', ['在盆里按住鼠标画圈', '搅到顺滑不停', '自动进入煎制']);
  drawPhotoPlaceholder(ctx);
  drawHeatBar(ctx);
  drawDecoBar(ctx);
  drawPolaroid(ctx, t);

  for (var s = 0; s < G.sparks.length; s++){
    var sp = G.sparks[s];
    if (!sp.touch) continue;
    spark(ctx, sp.x, sp.y, 12 * sp.life, sp.life * 0.7, '#E8B72A');
  }

  ctx.restore();
  requestAnimationFrame(render);
}

// ------------------------------------------------------------ 交互

function toDesign(e){
  var r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - fit.ox) / fit.s,
    y: (e.clientY - r.top - fit.oy) / fit.s
  };
}

function inRect(q, r){
  return q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h;
}

function distPan(q){
  var dx = (q.x - LAY.pan.x) / (PR * 0.80);
  var dy = (q.y - LAY.pan.y) / (PR * 0.70);
  return Math.sqrt(dx * dx + dy * dy);
}

function addSpark(x, y, touch){
  G.sparks.push({x: x, y: y, life: 1, touch: !!touch});
  if (G.sparks.length > 20) G.sparks.shift();
}

var dragging = null;

function setHeat(px){
  var k = LAY.heat;
  G.heat = cl01((px - (k.x + 66)) / (k.w - 92));
}

function handleButton(i){
  if (i === 0 && G.batter < 1){
    G.pourT = G.t;
    G.batter = 1;
    G.hint = '按住锅里的松饼能按下去；点「小火加热」开始煎';
    tone(560, 0.34, 'sine', 0.16, 170);
    noiseBurst(0.30, 0.12, 900);
  }
  if (i === 1 && G.batter >= 1){
    G.heating = !G.heating;
    G.hint = G.heating ? '等边缘起泡、颜色变金黄就可以翻面' : '火关了，随时可以再点开';
    if (G.heating){ tone(680, 0.10, 'square', 0.07); startSizzle(); }
    else { tone(420, 0.10, 'square', 0.06); stopSizzle(); }
  }
  if (i === 2 && G.cookA >= 0.55 && !G.flipped){
    G.flipped = true;
    G.flipT = G.t;
    G.cookA = 0.92;
    G.cookB = 0.12;
    G.hint = '翻过来了！继续加热到反面金黄，再点出锅';
    noiseBurst(0.26, 0.20, 2400);
    tone(300, 0.22, 'sine', 0.10, 620);
  }
  if (i === 3 && G.flipped && G.cookB >= 0.45){
    G.heating = false;
    G.outT = G.t;
    G.step = 4;
    G.hint = '最后一步，把黄油、蜂蜜和水果放上去';
    addSpark(STAGE.x, STAGE.y, false);
    stopSizzle();
    tone(880, 0.16, 'sine', 0.14);
    setTimeout(function(){ tone(1318, 0.26, 'sine', 0.12); }, 110);
  }
}

function handleDeco(i){
  if (G.deco[i]) return;
  G.deco[i] = true;
  G.decoT[i] = G.t;
  addSpark(STAGE.x + (i - 1) * 120, STAGE.y, false);
  tone(620 + i * 140, 0.14, 'triangle', 0.13);
  if (G.deco[0] && G.deco[1] && G.deco[2]){
    G.doneT = G.t;
    G.hint = '完成！按 R 可以重玩一遍';
    var notes = [880, 1108, 1318, 1760];
    for (var k = 0; k < notes.length; k++){
      (function(n, d){ setTimeout(function(){ tone(n, 0.30, 'sine', 0.12); }, d); })(notes[k], 130 * k);
    }
  } else {
    G.hint = '还差 ' + (3 - (G.deco[0]?1:0) - (G.deco[1]?1:0) - (G.deco[2]?1:0)) + ' 样装饰';
  }
}

function onDown(e){
  if (e.button !== undefined && e.button !== 0) return;
  initAudio();
  var q = toDesign(e);

  var sdx = q.x - 1516, sdy = q.y - 54;
  if (sdx * sdx + sdy * sdy < 34 * 34){
    muted = !muted;
    if (muted) stopSizzle();
    else { tone(760, 0.12, 'sine', 0.14); }
    return;
  }

  if (G.step === 1){
    var k = LAY.card;
    for (var i = 0; i < 4; i++){
      var y = k.y + 60 + i * 58;
      if (q.x >= k.x + 14 && q.x <= k.x + k.w - 14 && q.y >= y && q.y <= y + 48){
        if (!G.items[i]){
          G.items[i] = true;
          G.ingT[i] = G.t;
          addSpark(ING[i].x, ING[i].y, false);
          tone(520 + i * 70, 0.11, 'triangle', 0.12);
          var n = 0;
          for (var z = 0; z < 4; z++) if (G.items[z]) n++;
          if (n === 4){
            G.step = 2;
            G.hint = '在左边的盆里按住画圈，把面糊搅到顺滑';
          } else {
            G.hint = '还有 ' + (4 - n) + ' 样没拿，继续点';
          }
        }
        return;
      }
    }
  }

  if (G.step === 2){
    var b = LAY.bowl;
    var dx = (q.x - b.x) / (b.r * 0.92);
    var dy = (q.y - b.y) / (b.r * 0.78);
    if (dx * dx + dy * dy <= 1){
      dragging = 'stir';
      G.lastAng = Math.atan2(q.y - b.y, q.x - b.x);
      return;
    }
  }

  if (G.step === 3){
    for (var j = 0; j < 4; j++){
      if (inRect(q, btnRect(j))){
        handleButton(j);
        return;
      }
    }
    if (G.batter >= 1 && inRect(q, LAY.heat)){
      dragging = 'heat';
      setHeat(q.x);
      return;
    }
    if (G.batter >= 1 && distPan(q) < 1.05){
      addSpark(q.x, q.y, true);
      G.pointer.x = q.x;
      G.pointer.y = q.y;
      G.pointer.on = true;
    }
  }

  if (G.step === 4){
    for (var m = 0; m < 3; m++){
      if (inRect(q, decoRect(m))){
        handleDeco(m);
        return;
      }
    }
  }
}

function onMove(e){
  var q = toDesign(e);

  if (dragging === 'stir'){
    var b = LAY.bowl;
    var a = Math.atan2(q.y - b.y, q.x - b.x);
    var d = a - G.lastAng;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    G.lastAng = a;
    G.stir = Math.min(1, G.stir + Math.abs(d) * 0.22);
    if (G.stir >= 1 && G.step === 2){
      G.step = 3;
      G.step = 3;
      G.hint = '先点「倒入面糊」，再把锅烧热';
    }
    return;
  }

  if (dragging === 'heat'){
    setHeat(q.x);
    return;
  }

  if (G.step === 3 && G.batter >= 1){
    G.pointer.x = q.x;
    G.pointer.y = q.y;
    G.pointer.on = distPan(q) < 1.0;
  } else {
    G.pointer.on = false;
  }
}

function onUp(){
  if (G.pointer.on) addSpark(G.pointer.x, G.pointer.y, true);
  G.pointer.on = false;
  dragging = null;
  G.lastAng = null;
}

cvs.addEventListener('pointerdown', onDown);
cvs.addEventListener('pointermove', onMove);
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', onUp);
cvs.addEventListener('pointerleave', onUp);
addEventListener('resize', resize);
addEventListener('keydown', function(e){
  if (e.key === 'r' || e.key === 'R') location.reload();
});

resize();
requestAnimationFrame(render);

})();
</script>
