<script>
(function(){
'use strict';

var cvs = document.getElementById('scene');
var ctx = cvs.getContext('2d');
var DW = 1600, DH = 900;

var fit = { s: 1, ox: 0, oy: 0 };
var dpr = 1;

function resize(){
  var vw = innerWidth, vh = innerHeight;
  dpr = Math.min(devicePixelRatio || 1, 2);
  cvs.width  = Math.round(vw * dpr);
  cvs.height = Math.round(vh * dpr);
  var s = Math.min(vw / DW, vh / DH);
  fit.s = s;
  fit.ox = (vw - DW * s) / 2;
  fit.oy = (vh - DH * s) / 2;
}

var cl01 = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; };
var lerp = function(a,b,t){ return a + (b - a) * t; };
var eo   = function(t){ t = cl01(t); return 1 - Math.pow(1 - t, 3); };
var eio  = function(t){ t = cl01(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; };
var eob  = function(t){ t = cl01(t); var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2); };
var seg  = function(t,a,b){ return cl01((t - a) / (b - a)); };

function mixHex(a, b, t){
  var ar = parseInt(a.slice(1,3),16), ag = parseInt(a.slice(3,5),16), ab = parseInt(a.slice(5,7),16);
  var br = parseInt(b.slice(1,3),16), bg = parseInt(b.slice(3,5),16), bb = parseInt(b.slice(5,7),16);
  return 'rgb(' + Math.round(lerp(ar,br,t)) + ',' + Math.round(lerp(ag,bg,t)) + ',' + Math.round(lerp(ab,bb,t)) + ')';
}

function rr(c, x, y, w, h, r){
  var rad = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y,     x + w, y + h, rad);
  c.arcTo(x + w, y + h, x,     y + h, rad);
  c.arcTo(x,     y + h, x,     y,     rad);
  c.arcTo(x,     y,     x + w, y,     rad);
  c.closePath();
}

function spark(c, x, y, r, a, col){
  if (a <= 0.01 || r <= 0.2) return;
  c.save();
  c.globalAlpha = a;
  c.translate(x, y);
  var k = r * 0.20;
  c.beginPath();
  c.moveTo(0, -r);
  c.quadraticCurveTo(k, -k, r, 0);
  c.quadraticCurveTo(k, k, 0, r);
  c.quadraticCurveTo(-k, k, -r, 0);
  c.quadraticCurveTo(-k, -k, 0, -r);
  c.closePath();
  c.fillStyle = col || '#FFFFFF';
  c.fill();
  c.restore();
}

var LAY = {

  bowl:   {x: 830, y: 452, r: 208},
  cooker: {x: 566, y: 440, w: 528, h: 330},
  card:   {x: 40,  y: 96,  w: 262, h: 300},

};

  stir: 0,
  batter: 0,
  pourT: -1,
  heat: 0.5,
  heating: false,

  hint: '点击左边清单里的食材，把它们一个个摆上桌',

  lastAng: null,

var ING = [
  {name: '鸡蛋',   amt: '2 个',  type: 'egg',    x: 560,  y: 430},
  {name: '牛奶',   amt: '50 ml', type: 'milk',   x: 740,  y: 430},
  {name: '松饼粉', amt: '150 g', type: 'flour',  x: 920,  y: 430},
  {name: '黄油',   amt: '适量',  type: 'butter', x: 1100, y: 430}
];

var DECO = [
  {name: '黄油', type: 'butter'},
  {name: '蜂蜜', type: 'honey'},
  {name: '水果', type: 'fruit'}
];

var TEXN = 18;
var nodes = [];
for (var ni = 0; ni < (TEXN + 1) * (TEXN + 1); ni++) nodes.push({z: 0, v: 0});

var texCache = {};
var TEXBUCKETS = 12;

function clampF(v){ return v < 0 ? 0 : v > 1 ? 1 : v; }

function pathBear(c, cx, cy, R){
  c.beginPath();
  c.arc(cx, cy, R, 0, Math.PI * 2);
  var off = 0.70 * R, er = 0.38 * R;
  c.moveTo(cx + off + er, cy - off);
  c.arc(cx + off, cy - off, er, 0, Math.PI * 2);
  c.moveTo(cx - off + er, cy - off);
  c.arc(cx - off, cy - off, er, 0, Math.PI * 2);
  c.closePath();
}

function buildTexture(cook){
  var t = document.createElement('canvas');
  t.width = 512; t.height = 512;
  var g = t.getContext('2d');

  var R = 164, cx = 256, cy = 278;

  var c0 = mixHex('#FFF8DE', '#FBC97C', cook);
  var c1 = mixHex('#FBE7BA', '#D99544', cook);
  var c2 = mixHex('#EECB90', '#BE8544', cook);
  var c3 = mixHex('#C9955A', '#6E3A11', cook);

  g.save();
  pathBear(g, cx, cy + 6, R);
  g.shadowColor = 'rgba(150,90,40,0.45)';
  g.shadowBlur = 20;
  g.shadowOffsetY = 12;
  g.fillStyle = c3;
  g.fill();
  g.restore();

  pathBear(g, cx, cy, R);
  var rg = g.createRadialGradient(cx - 46, cy - 52, 22, cx, cy, R * 1.22);
  rg.addColorStop(0.00, c0);
  rg.addColorStop(0.34, c1);
  rg.addColorStop(0.66, c2);
  rg.addColorStop(0.88, c3);
  rg.addColorStop(1.00, c3);
  g.fillStyle = rg;
  g.fill();

  g.save();
  pathBear(g, cx, cy, R);
  g.clip();

  var sh = g.createLinearGradient(0, 70, 0, 440);
  sh.addColorStop(0.00, 'rgba(255,252,226,0.26)');
  sh.addColorStop(0.55, 'rgba(255,255,255,0)');
  sh.addColorStop(1.00, 'rgba(120,64,20,0.20)');
  g.fillStyle = sh;
  g.fillRect(0, 0, 512, 512);

  var seed = 7;
  function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  for (var i = 0; i < 760; i++){
    var x = 72 + rnd() * 368;
    var y = 78 + rnd() * 350;
    var r = 0.5 + rnd() * 2.6;
    g.beginPath();
    g.ellipse(x, y, r, r * 0.72, 0, 0, Math.PI * 2);
    g.fillStyle = rnd() > 0.5 ? 'rgba(150,92,42,0.16)' : 'rgba(255,246,214,0.52)';
    g.fill();
  }
  for (var j = 0; j < 18; j++){
    g.beginPath();
    g.ellipse(108 + rnd() * 296, 128 + rnd() * 250, 2 + rnd() * 3.2, 1.4 + rnd() * 2.2, 0, 0, Math.PI * 2);
    g.fillStyle = 'rgba(178,118,58,0.22)';
    g.fill();
  }

  var ink = mixHex('#C8B48C', '#8C4E1E', clampF(cook * 1.2));
  g.fillStyle = ink;
  g.beginPath(); g.ellipse(cx - 51, cy - 10, 7.5, 9.5, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx + 51, cy - 10, 7.5, 9.5, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = ink;
  g.lineWidth = 4.8;
  g.lineCap = 'round';
  g.beginPath();
  g.arc(cx, cy + 20, 19, 0.16 * Math.PI, 0.84 * Math.PI);
  g.stroke();

  g.globalAlpha = 0.5;
  g.fillStyle = mixHex('#E8A8B0', '#C97F62', cook);
  g.beginPath(); g.ellipse(cx - 90, cy + 30, 17, 11, 0, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(cx + 90, cy + 30, 17, 11, 0, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 1;

  g.restore();

  return t;
}

function getTex(cook){
  var b = Math.round(clampF(cook) * (TEXBUCKETS - 1));
  if (!texCache[b]) texCache[b] = buildTexture(b / (TEXBUCKETS - 1));
  return texCache[b];
}

var box = {left: 0, top: 0, side: 0};

function setBox(cx, cy, r){
  box.side = r * 2.5;
  box.left = cx - box.side / 2;
  box.top  = cy - box.side * 0.52;
}

function tri(c, img, a, b, d, sa, sb, sd){
  var den = sa.x*(sb.y-sd.y) + sb.x*(sd.y-sa.y) + sd.x*(sa.y-sb.y);
  if (Math.abs(den) < 0.01) return;
  var A = (a.x*(sb.y-sd.y) + b.x*(sd.y-sa.y) + d.x*(sa.y-sb.y)) / den;
  var B = (a.y*(sb.y-sd.y) + b.y*(sd.y-sa.y) + d.y*(sa.y-sb.y)) / den;
  var C = (a.x*(sd.x-sb.x) + b.x*(sa.x-sd.x) + d.x*(sb.x-sa.x)) / den;
  var D = (a.y*(sd.x-sb.x) + b.y*(sa.x-sd.x) + d.y*(sb.x-sa.x)) / den;
  var E = (a.x*(sb.x*sd.y-sd.x*sb.y) + b.x*(sd.x*sa.y-sa.x*sd.y) + d.x*(sa.x*sb.y-sb.x*sa.y)) / den;
  var F = (a.y*(sb.x*sd.y-sd.x*sb.y) + b.y*(sd.x*sa.y-sa.x*sd.y) + d.y*(sa.x*sb.y-sb.x*sa.y)) / den;
  c.save();
  c.beginPath();
  var gx = (a.x + b.x + d.x) / 3, gy = (a.y + b.y + d.y) / 3;
  var ex = 1.014;
  c.moveTo(gx + (a.x - gx) * ex, gy + (a.y - gy) * ex);
  c.lineTo(gx + (b.x - gx) * ex, gy + (b.y - gy) * ex);
  c.lineTo(gx + (d.x - gx) * ex, gy + (d.y - gy) * ex);
  c.closePath();
  c.clip();
  c.transform(A, B, C, D, E, F);
  c.drawImage(img, 0, 0);
  c.restore();
}

function springStep(dt, r, allowTouch){
  var p = G.pointer;
  var cell = box.side / TEXN;
  var st = Math.min(dt * 60, 2);

  for (var y = 0; y <= TEXN; y++){
    for (var x = 0; x <= TEXN; x++){
      var n = nodes[y * (TEXN + 1) + x];
      var wx = box.left + x * cell;
      var wy = box.top + y * cell;
      var f = 0;

      if (allowTouch && p.on){
        var dx = wx - p.x, dy = wy - p.y;
        f += Math.exp(-(dx*dx + dy*dy) / (r*r*0.085)) * 1.35;
      }
      for (var k = 0; k < G.sparks.length; k++){
        var h = G.sparks[k];
        if (!h.touch) continue;
        var ax = wx - h.x, ay = wy - h.y;
        f += Math.exp(-(ax*ax + ay*ay) / (r*r*0.09)) * h.life * 0.7;
      }

      n.v += (f - n.z) * 0.11 * st;
      n.v *= Math.pow(0.82, st);
      n.z += n.v * st;
    }
  }
}

function drawMesh(c, cook){
  var cell = box.side / TEXN;
  var stepT = 512 / TEXN;
  var verts = [];
  var i, j, x, y;

  for (y = 0; y <= TEXN; y++){
    for (x = 0; x <= TEXN; x++){
      var n = nodes[y * (TEXN + 1) + x];
      var wx = box.left + x * cell;
      var wy = box.top + y * cell;
      verts.push({x: wx - n.z * wx * 0.028, y: wy + n.z * 9});
    }
  }

  var tex = getTex(cook);

  for (j = 0; j < TEXN; j++){
    for (i = 0; i < TEXN; i++){
      var a = verts[j * (TEXN + 1) + i];
      var b = verts[j * (TEXN + 1) + i + 1];
      var d = verts[(j + 1) * (TEXN + 1) + i];
      var e = verts[(j + 1) * (TEXN + 1) + i + 1];
      tri(c, tex, a, b, d, {x: i*stepT, y: j*stepT}, {x: (i+1)*stepT, y: j*stepT}, {x: i*stepT, y: (j+1)*stepT});
      tri(c, tex, b, e, d, {x: (i+1)*stepT, y: j*stepT}, {x: (i+1)*stepT, y: (j+1)*stepT}, {x: i*stepT, y: (j+1)*stepT});
    }
  }
}

// ------------------------------------------------------------ 场景

function drawBackground(c, t){
  var g = c.createLinearGradient(0, 0, DW, DH);
  g.addColorStop(0.00, '#FFD3EE');
  g.addColorStop(0.34, '#E4D4FF');
  g.addColorStop(0.66, '#CFE7FF');
  g.addColorStop(1.00, '#FFDCEF');
  c.fillStyle = g;
  c.fillRect(0, 0, DW, DH);

  var blobs = [[240,220,620,'255,110,190',0.55],[1340,660,700,'110,225,195',0.45],[640,820,700,'166,140,244',0.5]];
  for (var i = 0; i < blobs.length; i++){
    var b = blobs[i];
    var rg = c.createRadialGradient(b[0], b[1], 0, b[0], b[1], b[2]);
    rg.addColorStop(0, 'rgba(' + b[3] + ',' + b[4] + ')');
    rg.addColorStop(1, 'rgba(' + b[3] + ',0)');
    c.fillStyle = rg;
    c.fillRect(0, 0, DW, DH);
  }

  c.save();
  c.strokeStyle = 'rgba(255,255,255,0.45)';
  c.lineWidth = 1;
  for (var d = -DH; d < DW; d += 54){
    c.beginPath();
    c.moveTo(d, 0);
    c.lineTo(d + DH, DH);
    c.stroke();
  }
  c.restore();

  c.save();
  c.globalAlpha = 0.42;
  for (var k = 0; k < 3; k++){
    var lg = c.createLinearGradient(120, 120, 1480, 800);
    lg.addColorStop(0.00, 'rgba(255,255,255,0)');
    lg.addColorStop(0.30, 'rgba(255,255,255,0.85)');
    lg.addColorStop(0.55, 'rgba(255,143,203,0.85)');
    lg.addColorStop(0.80, 'rgba(255,255,255,0.85)');
    lg.addColorStop(1.00, 'rgba(255,255,255,0)');
    c.strokeStyle = lg;
    c.lineWidth = 22;
    c.beginPath();
    c.arc(820, 980 + k * 40, 640 + k * 66, Math.PI * 1.10, Math.PI * 1.90);
    c.stroke();
  }
  c.restore();

  c.save();
  c.fillStyle = 'rgba(255,255,255,0.72)';
  for (var y = 20; y < DH; y += 46){
    var sh = ((y / 46) % 2 === 0) ? 0 : 23;
    for (var x = 20 + sh; x < DW; x += 46){
      c.beginPath();
      c.arc(x, y, 2.1, 0, Math.PI * 2);
      c.fill();
    }
  }
  c.restore();

  var tw = [[120,190,9,0],[1480,160,11,.8],[250,700,7,1.9],[1400,760,9,2.7],
            [60,860,7,3.4],[1540,420,8,4.2],[700,60,6,1.2],[980,868,7,5.0]];
  for (var s = 0; s < tw.length; s++){
    var a = 0.5 + 0.5 * Math.sin(t * 1.5 + tw[s][3]);
    spark(c, tw[s][0], tw[s][1], tw[s][2] * (0.78 + 0.22 * a), a * 0.95);
  }
}

function drawTable(c){
  c.save();
  c.shadowColor = 'rgba(140,100,180,0.28)';
  c.shadowBlur = 46;
  c.shadowOffsetY = 14;
  var g = c.createLinearGradient(0, 100, 0, 880);
  g.addColorStop(0.00, 'rgba(255,255,255,0.82)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.58)');
  g.addColorStop(1.00, 'rgba(255,250,255,0.72)');
  c.fillStyle = g;
  rr(c, 22, 108, 1556, 762, 30);
  c.fill();
  c.restore();

  c.save();
  c.lineWidth = 3;
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  rr(c, 22, 108, 1556, 762, 30);
  c.stroke();

  var ig = c.createLinearGradient(22, 108, 1578, 870);
  ig.addColorStop(0.00, 'rgba(255,143,203,0.55)');
  ig.addColorStop(0.30, 'rgba(255,255,255,0.10)');
  ig.addColorStop(0.58, 'rgba(127,227,200,0.50)');
  ig.addColorStop(0.82, 'rgba(255,255,255,0.10)');
  ig.addColorStop(1.00, 'rgba(183,166,240,0.55)');
  c.lineWidth = 6;
  c.strokeStyle = ig;
  rr(c, 22, 108, 1556, 762, 30);
  c.stroke();
  c.restore();
}

function drawCooker(c){
  var k = LAY.cooker;
  c.save();
  c.shadowColor = 'rgba(150,116,190,0.30)';
  c.shadowBlur = 40;
  c.shadowOffsetY = 16;
  var g = c.createLinearGradient(k.x, k.y, k.x, k.y + k.h);
  g.addColorStop(0, '#FFFFFF');
  g.addColorStop(0.55, '#F7F1FF');
  g.addColorStop(1, '#E9DFFB');
  c.fillStyle = g;
  rr(c, k.x, k.y, k.w, k.h, 34);
  c.fill();
  c.restore();

  var eg = c.createLinearGradient(k.x, k.y, k.x + k.w, k.y + k.h);
  eg.addColorStop(0.00, 'rgba(255,143,203,0.8)');
  eg.addColorStop(0.45, 'rgba(255,255,255,0.25)');
  eg.addColorStop(0.72, 'rgba(127,227,200,0.8)');
  eg.addColorStop(1.00, 'rgba(183,166,240,0.8)');
  c.lineWidth = 4;
  c.strokeStyle = eg;
  rr(c, k.x, k.y, k.w, k.h, 34);
  c.stroke();

  c.beginPath();
  c.ellipse(k.x + k.w / 2, k.y + 46, k.w * 0.30, 24, 0, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,0.5)';
  c.fill();

  var dx = k.x + 64, dy = k.y + k.h - 54;
  c.beginPath(); c.arc(dx, dy, 24, 0, Math.PI * 2);
  c.fillStyle = 'rgba(255,255,255,0.9)'; c.fill();
  c.lineWidth = 3; c.strokeStyle = 'rgba(190,170,220,0.9)'; c.stroke();
  c.beginPath();
  c.arc(dx, dy, 13, -Math.PI * 0.6, -Math.PI * 0.6 + 0.6 + G.heat * 3.6);
  c.lineWidth = 5; c.lineCap = 'round';
  c.strokeStyle = G.heating ? '#FF7FBE' : 'rgba(180,160,210,0.75)';
  c.stroke();

  c.font = '700 14px system-ui,-apple-system,"PingFang SC",sans-serif';
  c.fillStyle = 'rgba(150,120,180,0.85)';
  c.textAlign = 'left';
  c.fillText('BEAR COOKER', dx + 44, dy + 5);
}

function drawPan(c, t){
  var p = LAY.pan, R = p.r;
  var bob = Math.sin(t * 2.2) * 2.5;

  c.save();
  c.translate(p.x, p.y + bob);

  c.save();
  c.shadowColor = 'rgba(150,116,190,0.26)';
  c.shadowBlur = 26;
  c.shadowOffsetY = 14;
  c.beginPath();
  c.ellipse(6, R * 0.90, R * 0.92, R * 0.22, 0, 0, Math.PI * 2);
  c.fillStyle = 'rgba(150,116,190,0.11)';
  c.fill();
  c.restore();

  c.save();
  c.rotate(Math.PI * 0.25);
  rr(c, R * 0.86, -22, R * 0.82, 44, 22);
  var hg = c.createLinearGradient(0, -22, 0, 22);
  hg.addColorStop(0.00, '#FFD6F0');
  hg.addColorStop(0.30, '#FF92CE');
  hg.addColorStop(0.62, '#FF67B4');
  hg.addColorStop(1.00, '#E4559B');
  c.fillStyle = hg;
  c.fill();
  c.lineWidth = 2;
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.stroke();
  rr(c, R * 0.90, -16, R * 0.72, 11, 6);
  c.fillStyle = 'rgba(255,255,255,0.6)';
  c.fill();
  c.restore();

  var ig = c.createLinearGradient(-R, -R, R, R);
  ig.addColorStop(0.00, 'rgba(255,143,203,0.90)');
  ig.addColorStop(0.30, 'rgba(255,255,255,0.20)');
  ig.addColorStop(0.56, 'rgba(127,227,200,0.90)');
  ig.addColorStop(0.80, 'rgba(255,255,255,0.20)');
  ig.addColorStop(1.00, 'rgba(183,166,240,0.90)');

  pathBear(c, 0, 0, R);
  c.lineWidth = 18;
  c.strokeStyle = ig;
  c.stroke();
  c.lineWidth = 6;
  c.strokeStyle = 'rgba(255,255,255,0.95)';
  c.stroke();

// ------------------------------------------------------------ 音效

var AC = null, master = null, muted = false, sizzle = null;

function initAudio(){
  if (AC) { if (AC.state === 'suspended') { try{ AC.resume(); }catch(e){} } return; }
  try {
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = 0.5;
    master.connect(AC.destination);
    if (AC.state === 'suspended') AC.resume();
  } catch(e){ AC = null; }
}

function tone(freq, dur, type, vol, slideTo){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.014);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch(e){}
}

function noiseBurst(dur, vol, hz){
  if (!AC || muted) return;
  try {
    var t0 = AC.currentTime;
    var len = Math.ceil(AC.sampleRate * dur);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = AC.createBufferSource(); src.buffer = buf;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = hz || 1800; bp.Q.value = 0.9;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.22, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur + 0.02);
  } catch(e){}
}

function startSizzle(){
  if (!AC || muted || sizzle) return;
  try {
    var len = Math.floor(AC.sampleRate * 2);
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    var src = AC.createBufferSource();
    src.buffer = buf; src.loop = true;
    var bp = AC.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 3400; bp.Q.value = 0.7;
    var g = AC.createGain();
    g.gain.value = 0.0001;
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start();
    g.gain.linearRampToValueAtTime(0.055, AC.currentTime + 0.5);
    sizzle = {src: src, g: g};
  } catch(e){ sizzle = null; }
}

function stopSizzle(){
  if (!sizzle || !AC) return;
  try {
    var s = sizzle;
    sizzle = null;
    s.g.gain.cancelScheduledValues(AC.currentTime);
    s.g.gain.setValueAtTime(s.g.gain.value, AC.currentTime);
    s.g.gain.linearRampToValueAtTime(0.0001, AC.currentTime + 0.28);
    setTimeout(function(){ try{ s.src.stop(); }catch(e){} }, 360);
  } catch(e){ sizzle = null; }
}

function burstPath(c, x, y, r1, r2, n){
  c.beginPath();
  for (var i = 0; i < n * 2; i++){
    var a = -Math.PI / 2 + i * Math.PI / n;
    var r = (i % 2 === 0) ? r1 : r2;
    var px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}

        var yy = lerp(it.y - 140, it.y, eob(q));

        c.save();
        c.shadowColor = 'rgba(120,70,40,0.30)';
        c.shadowBlur = 10;
        c.shadowOffsetY = 5;
        c.beginPath();
        c.ellipse(it.x, yy, it.r, it.r * 0.92, 0, 0, Math.PI * 2);
        var fg = c.createRadialGradient(it.x - it.r * 0.34, yy - it.r * 0.38, 2, it.x, yy, it.r * 1.06);
        fg.addColorStop(0.00, it.c1);
        fg.addColorStop(0.62, it.c1);
        fg.addColorStop(1.00, it.c2);
        c.fillStyle = fg;
        c.fill();
        c.restore();

        c.beginPath();
        c.ellipse(it.x - it.r * 0.30, yy - it.r * 0.34, it.r * 0.34, it.r * 0.24, -0.6, 0, Math.PI * 2);
        c.fillStyle = 'rgba(255,255,255,0.62)';
        c.fill();

        if (it.leaf){
          c.save();
          c.translate(it.x + it.r * 0.30, yy - it.r * 0.86);
          c.rotate(-0.34);
          c.beginPath();
          c.ellipse(0, 0, it.r * 0.46, it.r * 0.22, 0, 0, Math.PI * 2);
          c.fillStyle = '#5FAE7A';
          c.fill();
          c.restore();
        }
      }
    }
  }
}

// ------------------------------------------------------------ 循环

var last = performance.now();

function update(dt){
  G.t += dt;

  if (G.step === 3 && G.heating && G.batter >= 1){
    var rate = 0.10 + G.heat * 0.42;
    if (!G.flipped) G.cookA = Math.min(1.2, G.cookA + dt * rate);
    else G.cookB = Math.min(1.2, G.cookB + dt * rate);
  }

  for (var i = G.sparks.length - 1; i >= 0; i--){
    if (G.sparks[i].touch) G.sparks[i].life -= dt * 1.6;
    if (G.sparks[i].life <= 0) G.sparks.splice(i, 1);
  }
}

function render(now){
  var dt = (now - last) / 1000;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  last = now;
  update(dt);
  var t = G.t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  ctx.save();
  ctx.translate(fit.ox, fit.oy);
  ctx.scale(fit.s, fit.s);

  drawBackground(ctx, t);
  drawTable(ctx);
  drawHeader(ctx);
  drawSoundToggle(ctx);
  drawSteps(ctx, t);
  drawHint(ctx);
  drawCard(ctx);

  if (G.step === 2){
    drawBowl(ctx, t);
    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = 'italic 700 27px Georgia,"Times New Roman",serif';
    ctx.fillStyle = 'rgba(168,124,206,0.50)';
    ctx.fillText('MIXING', 830, 742);
    ctx.font = '600 15px system-ui,-apple-system,"PingFang SC",sans-serif';
    ctx.fillStyle = 'rgba(150,118,182,0.68)';
    ctx.fillText('在盆里画圈，把面糊搅到顺滑', 830, 770);
    ctx.restore();
  } else if (G.step === 3){
    drawCooker(ctx);
    drawPan(ctx, t);
    setBox(0, 0, PRP);
    springStep(dt, PRP, true);
    drawPanPancake(ctx, t);
  } else if (G.step >= 4){
    drawDish(ctx);
    drawPlatePancake(ctx, t);
    drawDishDeco(ctx, t);
    drawDoneSticker(ctx, t);
  }

  if (G.step === 1){
    for (var i = 0; i < 4; i++){
      var it = ING[i];
      if (!G.items[i]){
        drawIngSlot(ctx, it.x, it.y, it.name);
        continue;
      }
      var ap = seg(t, G.ingT[i], G.ingT[i] + 0.5);
      if (ap > 0) drawIngredient(ctx, it.type, it.x, it.y - (1 - eob(ap)) * 80, 1.55 * (0.4 + 0.6 * eo(ap)));
    }
    drawStep1Caption(ctx, t);
  }

  if (G.step === 3) drawButtons(ctx);
  else if (G.step === 1) drawTipCard(ctx, '怎么开始', ['点左边清单里的食材', '四样全部摆上桌', '自动进入混合面糊']);
  else if (G.step === 2) drawTipCard(ctx, '怎么搅拌', ['在盆里按住鼠标画圈', '搅到顺滑不停', '自动进入煎制']);
  drawPhotoPlaceholder(ctx);
  drawHeatBar(ctx);
  drawDecoBar(ctx);
  drawPolaroid(ctx, t);

  for (var s = 0; s < G.sparks.length; s++){
    var sp = G.sparks[s];
    if (!sp.touch) continue;
    spark(ctx, sp.x, sp.y, 12 * sp.life, sp.life * 0.7, '#FFFFFF');
  }

  ctx.restore();
  requestAnimationFrame(render);
}

// ------------------------------------------------------------ 交互

function toDesign(e){
  var r = cvs.getBoundingClientRect();
  return {
    x: (e.clientX - r.left - fit.ox) / fit.s,
    y: (e.clientY - r.top - fit.oy) / fit.s
  };
}

function inRect(q, r){
  return q.x >= r.x && q.x <= r.x + r.w && q.y >= r.y && q.y <= r.y + r.h;
}

function distPan(q){
  var dx = (q.x - LAY.pan.x) / (PR * 0.80);
  var dy = (q.y - LAY.pan.y) / (PR * 0.70);
  return Math.sqrt(dx * dx + dy * dy);
}

function addSpark(x, y, touch){
  G.sparks.push({x: x, y: y, life: 1, touch: !!touch});
  if (G.sparks.length > 20) G.sparks.shift();
}

var dragging = null;

function setHeat(px){
  var k = LAY.heat;
  G.heat = cl01((px - (k.x + 66)) / (k.w - 92));
}

function handleButton(i){
  if (i === 0 && G.batter < 1){
    G.pourT = G.t;
    G.batter = 1;
    G.hint = '按住锅里的松饼能按下去；点「小火加热」开始煎';
    tone(560, 0.34, 'sine', 0.16, 170);
    noiseBurst(0.30, 0.12, 900);
  }
  if (i === 1 && G.batter >= 1){
    G.heating = !G.heating;
    G.hint = G.heating ? '等边缘起泡、颜色变金黄就可以翻面' : '火关了，随时可以再点开';
    if (G.heating){ tone(680, 0.10, 'square', 0.07); startSizzle(); }
    else { tone(420, 0.10, 'square', 0.06); stopSizzle(); }
  }
  if (i === 2 && G.cookA >= 0.55 && !G.flipped){
    G.flipped = true;
    G.flipT = G.t;
    G.cookA = 0.92;
    G.cookB = 0.12;
    G.hint = '翻过来了！继续加热到反面金黄，再点出锅';
    noiseBurst(0.26, 0.20, 2400);
    tone(300, 0.22, 'sine', 0.10, 620);
  }
  if (i === 3 && G.flipped && G.cookB >= 0.45){
    G.heating = false;
    G.outT = G.t;
    G.step = 4;
    G.hint = '最后一步，把黄油、蜂蜜和水果放上去';
    addSpark(STAGE.x, STAGE.y, false);
    stopSizzle();
    tone(880, 0.16, 'sine', 0.14);
    setTimeout(function(){ tone(1318, 0.26, 'sine', 0.12); }, 110);
  }
}

function handleDeco(i){
  if (G.deco[i]) return;
  G.deco[i] = true;
  G.decoT[i] = G.t;
  addSpark(STAGE.x + (i - 1) * 120, STAGE.y, false);
  tone(620 + i * 140, 0.14, 'triangle', 0.13);
  if (G.deco[0] && G.deco[1] && G.deco[2]){
    G.doneT = G.t;
    G.hint = '完成！按 R 可以重玩一遍';
    var notes = [880, 1108, 1318, 1760];
    for (var k = 0; k < notes.length; k++){
      (function(n, d){ setTimeout(function(){ tone(n, 0.30, 'sine', 0.12); }, d); })(notes[k], 130 * k);
    }
  } else {
    G.hint = '还差 ' + (3 - (G.deco[0]?1:0) - (G.deco[1]?1:0) - (G.deco[2]?1:0)) + ' 样装饰';
  }
}

function onDown(e){
  if (e.button !== undefined && e.button !== 0) return;
  initAudio();
  var q = toDesign(e);

  var sdx = q.x - 1516, sdy = q.y - 54;
  if (sdx * sdx + sdy * sdy < 34 * 34){
    muted = !muted;
    if (muted) stopSizzle();
    else { tone(760, 0.12, 'sine', 0.14); }
    return;
  }

  if (G.step === 1){
    var k = LAY.card;
    for (var i = 0; i < 4; i++){
      var y = k.y + 60 + i * 58;
      if (q.x >= k.x + 14 && q.x <= k.x + k.w - 14 && q.y >= y && q.y <= y + 48){
        if (!G.items[i]){
          G.items[i] = true;
          G.ingT[i] = G.t;
          addSpark(ING[i].x, ING[i].y, false);
          tone(520 + i * 70, 0.11, 'triangle', 0.12);
          var n = 0;
          for (var z = 0; z < 4; z++) if (G.items[z]) n++;
          if (n === 4){
            G.step = 2;
            G.hint = '在左边的盆里按住画圈，把面糊搅到顺滑';
          } else {
            G.hint = '还有 ' + (4 - n) + ' 样没拿，继续点';
          }
        }
        return;
      }
    }
  }

  if (G.step === 2){
    var b = LAY.bowl;
    var dx = (q.x - b.x) / (b.r * 0.92);
    var dy = (q.y - b.y) / (b.r * 0.78);
    if (dx * dx + dy * dy <= 1){
      dragging = 'stir';
      G.lastAng = Math.atan2(q.y - b.y, q.x - b.x);
      return;
    }
  }

  if (G.step === 3){
    for (var j = 0; j < 4; j++){
      if (inRect(q, btnRect(j))){
        handleButton(j);
        return;
      }
    }
    if (G.batter >= 1 && inRect(q, LAY.heat)){
      dragging = 'heat';
      setHeat(q.x);
      return;
    }
    if (G.batter >= 1 && distPan(q) < 1.05){
      addSpark(q.x, q.y, true);
      G.pointer.x = q.x;
      G.pointer.y = q.y;
      G.pointer.on = true;
    }
  }

  if (G.step === 4){
    for (var m = 0; m < 3; m++){
      if (inRect(q, decoRect(m))){
        handleDeco(m);
        return;
      }
    }
  }
}

function onMove(e){
  var q = toDesign(e);

  if (dragging === 'stir'){
    var b = LAY.bowl;
    var a = Math.atan2(q.y - b.y, q.x - b.x);
    var d = a - G.lastAng;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    G.lastAng = a;
    G.stir = Math.min(1, G.stir + Math.abs(d) * 0.22);
    if (G.stir >= 1 && G.step === 2){
      G.step = 3;
      G.step = 3;
      G.hint = '先点「倒入面糊」，再把锅烧热';
    }
    return;
  }

  if (dragging === 'heat'){
    setHeat(q.x);
    return;
  }

  if (G.step === 3 && G.batter >= 1){
    G.pointer.x = q.x;
    G.pointer.y = q.y;
    G.pointer.on = distPan(q) < 1.0;
  } else {
    G.pointer.on = false;
  }
}

function onUp(){
  if (G.pointer.on) addSpark(G.pointer.x, G.pointer.y, true);
  G.pointer.on = false;
  dragging = null;
  G.lastAng = null;
}

cvs.addEventListener('pointerdown', onDown);
cvs.addEventListener('pointermove', onMove);
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', onUp);
cvs.addEventListener('pointerleave', onUp);
addEventListener('resize', resize);
addEventListener('keydown', function(e){
  if (e.key === 'r' || e.key === 'R') location.reload();
});

resize();
requestAnimationFrame(render);

})();
</script>
